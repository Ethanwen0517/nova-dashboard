<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova 新聞文字雲</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif; background:#f0f2f5; padding:12px; }
.cloud-wrap {
  position:relative;
  width:800px;
  max-width:100%;
  aspect-ratio:800/900;
  margin:0 auto;
  border-radius:12px;
  overflow:visible;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  background:#fff;
}
.cloud-img {
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:800/900;
}
.cloud-svg {
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
.cloud-svg circle { pointer-events:all; }
.cloud-svg circle:hover + text,
.cloud-svg text { opacity:0.85; }
.cloud-header {
  background:#fff;
  padding:12px 16px 8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #f0f0f0;
}
.cloud-header h2 { font-size:15px; color:#333; }
.cloud-header span { font-size:12px; color:#888; }
.cloud-tip {
  display:none;
  position:fixed;
  background:rgba(30,30,30,0.95);
  color:#fff;
  padding:10px 14px;
  border-radius:8px;
  font-size:13px;
  line-height:1.6;
  max-width:300px;
  z-index:9999;
  pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,0.35);
  white-space:pre-line;
  max-height:200px;
  overflow-y:auto;
}
.cloud-tip-name { font-size:11px; color:#aaa; margin-bottom:4px; }
.cloud-filter {
  display:none;
  background:#f8f9fa;
  border-top:1px solid #e0e0e0;
  padding:12px 16px;
  max-height:220px;
  overflow-y:auto;
}
.cloud-filter-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.cloud-filter-title strong { color:#333; font-size:14px; }
.cloud-filter-title button {
  background:#e74c3c; color:#fff; border:none; border-radius:4px;
  padding:3px 10px; cursor:pointer; font-size:12px;
}
.cloud-news-list { font-size:13px; color:#444; line-height:1.7; }
.cloud-news-item { margin:5px 0; padding-left:8px; border-left:2px solid #ddd; }
.cloud-note { font-size:11px; color:#bbb; text-align:center; padding:6px 0 10px; }
</style>
</head>

function showTip(evt) {
  const el = evt.target;
  const word = el.getAttribute('data-word');
  if (!word) return;
  const d = WD[word];
  if (!d) return;
  const tip = document.getElementById('tip');
  tip.innerHTML = '<div class="cloud-tip-name">📊 ' + word + ' · ' + d.freq + ' 次</div><div style="color:#ccc;font-size:12px;margin-bottom:4px;">點擊看相關新聞</div>' + d.news;
  tip.style.display = 'block';
  tip.style.left = (evt.clientX + 15) + 'px';
  tip.style.top = (evt.clientY - 20) + 'px';
}

function hideTip() {
  document.getElementById('tip').style.display = 'none';
}

  const el = evt.target;

}

function clearFilter() {
  document.getElementById('filter').style.display = 'none';
}

// 跟隨滑鼠的 tooltip
document.addEventListener('mousemove', function(e) {
  const tip = document.getElementById('tip');
  if (tip.style.display === 'block') {
    tip.style.left = (e.clientX + 15) + 'px';
    tip.style.top = (e.clientY - 20) + 'px';
  }
});
</script>
</body>
</html>
