<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友達光電 2409 籌碼分析 TEST</title>
<style>
body { font-family: Inter, "Noto Sans TC", sans-serif; background: #f9fafb; margin: 0; padding: 20px; }
.header { display: flex; gap: 24px; align-items: center; margin-bottom: 16px; font-size: 14px; color: #6b7280; }
.main-title { font-size: 20px; font-weight: 600; color: #0a2540; }
.dashboard { display: grid; gap: 16px; }
.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; }
.chart-title { font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px; }
#chip-chart { width: 100%; height: 320px; }
</style>
</head>
<body>
<div class="header">
  <span class="main-title">友達光電 2409 籌碼分析</span>
</div>
<div class="dashboard">
  <div class="card">
    <div class="chart-title">三大法人動態（十日）</div>
    <div id="chip-chart"></div>
  </div>
</div>
<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
var L=LightweightCharts;
var dates=['2026-04-17','2026-04-20','2026-04-21','2026-04-22','2026-04-23','2026-04-24','2026-04-27','2026-04-28','2026-04-29','2026-04-30'];
var closes=[19.85,19.25,18.9,18.55,17.75,17.2,17.35,17.2,17.3,17.2];
var foreign=[0,-39865,-32102,10117,-29434,-17789,-37483,-21454,-27889,-19190];
var trust=[0,1,27,-30,-10,-33,-12,20,1,-12];
var dealer=[0,-1987,-42,-2158,-3135,-1886,453,-732,-779,-975];
var total=[0,-41851,-32117,7929,-32579,-19708,-37042,-22166,-28667,-20177];

var el=document.getElementById("chip-chart");
if(!el){console.log("No chip-chart element");return;}

var chart=L.createChart(el,{layout:{background:{color:"#fff"},textColor:"#374151"},width:860,height:320});

var leftScale=chart.addSeries(L.LineSeries,{color:"#10b981",lineWidth:1,priceLineVisible:false,axisLabelVisible:true,priceScaleId:"left"});
leftScale.setData(dates.map(function(d,i){return{time:d,value:foreign[i]};}));
chart.priceScale("left").applyOptions({scaleMargins:{top:0.1,bottom:0.1}});

var priceLine=chart.addSeries(L.LineSeries,{color:"#635bff",lineWidth:2,priceLineVisible:false,axisLabelVisible:true,priceScaleId:"right"});
priceLine.setData(dates.map(function(d,i){return{time:d,value:closes[i]};}));
chart.priceScale("right").applyOptions({scaleMargins:{top:0.2,bottom:0.2}});

chart.timeScale().fitContent();
console.log("Chart initialized OK");
})();
</script>
</body>
</html>
