<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>Debug Test</title>
</head>
<body style="background:#f9fafb;padding:20px;">
<div id="chart" style="width:860px;height:320px;background:#fff;border:1px solid #e5e7eb;"></div>
<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
console.log("1: Script start");
var el=document.getElementById("chart");
if(!el){console.log("ERROR: No element");return;}
console.log("2: Element found, width="+el.clientWidth);

var chart=LightweightCharts.createChart(el,{width:el.clientWidth||860,height:320,layout:{background:{color:"#fff"},textColor:"#374151"}});
console.log("3: Chart created");

var leftScale=chart.addSeries(LightweightCharts.LineSeries,{color:"#10b981",lineWidth:1,priceLineVisible:false,axisLabelVisible:true,priceScaleId:"left"});
console.log("4: Left series added");

var data=[{time:"2026-04-17",value:100},{time:"2026-04-20",value:105},{time:"2026-04-21",value:103}];
leftScale.setData(data);
console.log("5: Data set");

chart.priceScale("left").applyOptions({scaleMargins:{top:0.1,bottom:0.1}});
console.log("6: Price scale applied");

var priceLine=chart.addSeries(LightweightCharts.LineSeries,{color:"#635bff",lineWidth:2,priceLineVisible:false,axisLabelVisible:true,priceScaleId:"right"});
priceLine.setData([{time:"2026-04-17",value:19.85},{time:"2026-04-20",value:19.25},{time:"2026-04-21",value:18.9}]);
console.log("7: Price series added");

chart.priceScale("right").applyOptions({scaleMargins:{top:0.2,bottom:0.2}});
console.log("8: Right price scale applied");

chart.timeScale().fitContent();
console.log("9: TimeScale fitted");

window.addEventListener("resize",function(){
  var w=Math.min(860,window.innerWidth-32);
  chart.resize(w,320);
  console.log("Resize to "+w);
});

console.log("10: Init complete - script end");
})();
</script>
</body></html>
