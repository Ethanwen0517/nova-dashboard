<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Chart CDN</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f5f5f5}
.chart-container{width:100%;height:320px;background:#fff;border:1px solid #ccc;margin-bottom:20px}
</style>
</head>
<body>
<h1>Test: Lightweight Charts from CDN</h1>
<div id="chip-chart" class="chart-container"></div>
<p>Library version: <span id="lib-version"></span></p>
<p>Chart created: <span id="chart-status"></span></p>
<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
document.getElementById('lib-version').textContent = window.LightweightCharts ? window.LightweightCharts.version() : 'NOT LOADED';
document.getElementById('chart-status').textContent = 'Ready - running init';
(function(){
  var dates=['2026-04-17', '2026-04-20', '2026-04-21', '2026-04-22', '2026-04-23', '2026-04-24', '2026-04-27', '2026-04-28', '2026-04-29', '2026-04-30'];
  var closes=[19.85, 19.25, 18.9, 18.55, 17.75, 17.2, 17.35, 17.2, 17.3, 17.2];
  var foreign=[0, -39865, -32102, 10117, -29434, -17789, -37483, -21454, -27889, -19190];
  var trust=[0, 1, 27, -30, -10, -33, -12, 20, 1, -12];
  var dealer=[0, -1987, -42, -2158, -3135, -1886, 453, -732, -779, -975];
  var total=[0, -41851, -32117, 7929, -32579, -19708, -37042, -22166, -28667, -20177];
  
  var priceData=dates.map(function(d,i){return{time:d,value:closes[i]};});
  var foreignData=dates.map(function(d,i){return{time:d,value:foreign[i]};});
  var trustData=dates.map(function(d,i){return{time:d,value:trust[i]};});
  var dealerData=dates.map(function(d,i){return{time:d,value:dealer[i]};});
  var totalData=dates.map(function(d,i){return{time:d,value:total[i]};});
  
  var el=document.getElementById('chip-chart');
  if(!el){document.body.insertAdjacentHTML('beforeend','<p>No chip-chart element!</p>');return;}
  
  var LCHART={
    layout:{background:{color:'#fff'},textColor:'#374151'},
    grid:{vertLines:{color:'#f3f4f6'},horzLines:{color:'#f3f4f6'}},
    crosshair:{mode:0},
    timeScale:{borderColor:'#e5e7eb',timeVisible:false,rightOffset:5},
    rightPriceScale:{borderColor:'#e5e7eb'},
    handleScroll:{mouseWheel:true,pressedMouseMove:true},
    handleScale:{axisPressedMouseMove:true}
  };
  
  var chart=window.LightweightCharts.createChart(el,Object.assign({},LCHART,{width:el.clientWidth||860,height:320}));
  
  var priceLine=chart.addSeries(window.LightweightCharts.LineSeries,{color:'#635bff',lineWidth:2,priceLineVisible:false,axisLabelVisible:true});
  priceLine.setData(priceData);
  
  var foreignLine=chart.addSeries(window.LightweightCharts.LineSeries,{color:'#10b981',lineWidth:1,priceLineVisible:false,axisLabelVisible:false});
  foreignLine.setData(foreignData);
  
  var trustLine=chart.addSeries(window.LightweightCharts.LineSeries,{color:'#f59e0b',lineWidth:1,priceLineVisible:false,axisLabelVisible:false});
  trustLine.setData(trustData);
  
  var dealerLine=chart.addSeries(window.LightweightCharts.LineSeries,{color:'#ef4444',lineWidth:1,priceLineVisible:false,axisLabelVisible:false});
  dealerLine.setData(dealerData);
  
  var totalLine=chart.addSeries(window.LightweightCharts.LineSeries,{color:'#8b5cf6',lineWidth:1,priceLineVisible:false,axisLabelVisible:false});
  totalLine.setData(totalData);
  
  chart.timeScale().fitContent();
  window._chart = chart; // for debugging
  
  window.addEventListener('resize',function(){
    var w=Math.min(860,window.innerWidth-32);
    chart.resize(w,320);
  });
})();
document.getElementById('chart-status').textContent = 'Script completed';
</script>
</body>
</html>
