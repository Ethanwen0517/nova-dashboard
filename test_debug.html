<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LWC Debug</title>
</head>
<body>
<div id="c1" style="height:200px;margin:10px;"></div>
<div id="c2" style="height:200px;margin:10px;"></div>
<div id="c3" style="height:200px;margin:10px;"></div>
<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
try {
  var c1 = document.getElementById('c1');
  var chart1 = LightweightCharts.createChart(c1, {width:800,height:200});
  var s1 = chart1.addSeries(LightweightCharts.LineSeries, {color:'#10b981'});
  s1.setData([
    {time:'2026-04-17',value:0},
    {time:'2026-04-20',value:-39865},
    {time:'2026-04-21',value:-32102},
    {time:'2026-04-22',value:10117},
    {time:'2026-04-23',value:-29434}
  ]);
  chart1.timeScale().fitContent();
  console.log('Chart 1 (LineSeries, separate chart): OK');
} catch(e) { console.error('Chart 1 error:', e.message); }

// Test 2: just price line
try {
  var c2 = document.getElementById('c2');
  var chart2 = LightweightCharts.createChart(c2, {width:800,height:200});
  var s2 = chart2.addSeries(LightweightCharts.LineSeries, {color:'#635bff',lineWidth:2});
  s2.setData([
    {time:'2026-04-17',value:19.85},
    {time:'2026-04-20',value:19.25},
    {time:'2026-04-21',value:18.9},
    {time:'2026-04-22',value:18.55},
    {time:'2026-04-23',value:17.75}
  ]);
  chart2.timeScale().fitContent();
  console.log('Chart 2 (LineSeries price): OK');
} catch(e) { console.error('Chart 2 error:', e.message); }

// Test 3: dual series on same chart
try {
  var c3 = document.getElementById('c3');
  var chart3 = LightweightCharts.createChart(c3, {width:800,height:200});
  var left3 = chart3.addSeries(LightweightCharts.LineSeries,{color:'#10b981',priceScaleId:'left'});
  left3.setData([
    {time:'2026-04-17',value:0},
    {time:'2026-04-20',value:-39865}
  ]);
  chart3.priceScale('left').applyOptions({scaleMargins:{top:0.1,bottom:0.1}});
  var right3 = chart3.addSeries(LightweightCharts.LineSeries,{color:'#635bff',lineWidth:2,priceScaleId:'right'});
  right3.setData([
    {time:'2026-04-17',value:19.85},
    {time:'2026-04-20',value:19.25}
  ]);
  chart3.priceScale('right').applyOptions({scaleMargins:{top:0.2,bottom:0.2}});
  chart3.timeScale().fitContent();
  console.log('Chart 3 (dual scale): OK');
} catch(e) { console.error('Chart 3 error:', e.message); }
})();
</script>
</body>
</html>
